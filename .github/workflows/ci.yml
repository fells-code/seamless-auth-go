name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # The adapter conformance suite from seamless-cli, against the reference app in
  # conformance/refapp: the same specs the Express and Fastify adapters pass.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: seamless-auth-go
      - uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-auth-api
          path: seamless-auth-api
      - uses: actions/checkout@v4
        with:
          repository: fells-code/seamless-cli
          path: seamless-cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: seamless-auth-go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the CLI
        working-directory: seamless-cli
        run: npm ci && npm run build
      - name: Start the reference app
        working-directory: seamless-auth-go
        env:
          PORT: '8080'
          AUTH_SERVER_URL: http://localhost:5312
          AUTH_SERVER_ISSUER: http://auth-api:5312
          API_SERVICE_TOKEN: verify-dev-service-token-not-a-real-secret
          COOKIE_SIGNING_KEY: verify-dev-service-token-not-a-real-secret
          JWKS_KID: dev-main
        run: |
          go build -o refapp ./conformance/refapp
          nohup ./refapp > refapp.log 2>&1 &
      - name: Conformance
        env:
          SEAMLESS_API_DIR: ${{ github.workspace }}/seamless-auth-api
        run: node seamless-cli/dist/index.js verify --adapter-url=http://localhost:8080
      - name: Reference app log
        if: always()
        run: cat seamless-auth-go/refapp.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: seamless-cli/verify/harness/results/
          if-no-files-found: ignore
